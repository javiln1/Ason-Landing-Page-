<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Calendly embed stylesheet -->
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>

    <style>
        :root {
            --bg-primary: #0a0908;
            --bg-secondary: #141210;
            --bg-card: #1a1714;
            --text-primary: #f5f0e8;
            --text-secondary: #a89f94;
            --accent-burgundy: #5b1f0f;
            --accent-gold: #d4a574;
            --accent-gold-dim: rgba(212, 165, 116, 0.3);
            --accent-gold-glow: rgba(212, 165, 116, 0.15);
            --border-subtle: rgba(212, 165, 116, 0.12);
            --font-heading: 'Cinzel', serif;
            --font-body: 'Cormorant Garamond', serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            font-weight: 400;
            font-size: 1.125rem;
            line-height: 1.7;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Noise texture overlay */
        .noise-overlay { position: relative; }
        .noise-overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-size: 256px 256px;
            z-index: 1;
        }
        .noise-overlay > * { position: relative; z-index: 2; }

        /* Reveal animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }

        /* Gold shimmer */
        @keyframes goldShimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .shimmer {
            background: linear-gradient(90deg, var(--accent-gold) 0%, #f0d9b5 40%, var(--accent-gold) 60%, #f0d9b5 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldShimmer 6s linear infinite;
        }

        /* ======== NAV ======== */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 9, 8, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 1px 0 var(--border-subtle);
        }
        .nav-logo {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: var(--text-primary);
            text-decoration: none;
        }
        .nav-logo strong {
            color: var(--accent-gold);
            font-weight: 700;
        }
        .nav-back {
            font-family: var(--font-heading);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5em;
        }
        .nav-back:hover { color: var(--accent-gold); }

        /* ======== BOOKING SECTION ======== */
        .booking-section {
            flex: 1;
            padding: 7rem 2rem 4rem;
            background:
                radial-gradient(ellipse 60% 50% at 50% 30%, rgba(91, 31, 15, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 70% 70%, rgba(212, 165, 116, 0.05) 0%, transparent 60%),
                var(--bg-primary);
        }

        .booking-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .booking-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-badge {
            display: inline-block;
            font-family: var(--font-heading);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent-gold);
            background: rgba(212, 165, 116, 0.1);
            border: 1px solid var(--accent-gold-dim);
            padding: 0.4em 1.2em;
            border-radius: 100px;
            margin-bottom: 1.5rem;
        }

        .booking-title {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        .booking-subtitle {
            font-family: var(--font-body);
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            color: var(--text-secondary);
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Calendly card with gold corner frames */
        .calendly-frame {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px;
        }
        .calendly-frame::before,
        .calendly-frame::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid var(--accent-gold);
            pointer-events: none;
            z-index: 3;
        }
        .calendly-frame::before {
            top: 0; left: 0;
            border-right: none; border-bottom: none;
        }
        .calendly-frame::after {
            bottom: 0; right: 0;
            border-left: none; border-top: none;
        }

        .calendly-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        .calendly-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .calendly-inline-widget {
            min-width: 320px;
            height: 700px;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Steps indicator */
        .booking-steps {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 3rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .step-num {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .step-num.completed {
            background: rgba(212, 165, 116, 0.15);
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
        }
        .step-num.active {
            background: var(--accent-gold);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.3);
        }
        .step-num.upcoming {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        .step-label {
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .step-label.completed { color: var(--accent-gold); opacity: 0.7; }
        .step-label.active { color: var(--text-primary); }
        .step-label.upcoming { color: var(--text-secondary); opacity: 0.5; }
        .step-connector {
            width: 40px;
            height: 1px;
            background: var(--border-subtle);
            align-self: center;
        }

        .booking-footer {
            text-align: center;
            margin-top: 2.5rem;
        }

        .booking-note {
            font-family: var(--font-body);
            font-size: 1.05rem;
            color: var(--text-secondary);
            opacity: 0.7;
            font-style: italic;
        }

        /* ======== RESPONSIVE ======== */
        @media (max-width: 768px) {
            .booking-section { padding: 6rem 1.25rem 3rem; }
            .booking-header { margin-bottom: 2rem; }
            .calendly-card { padding: 1rem; }
            .calendly-inline-widget { height: 800px; }
            .booking-steps { gap: 1.5rem; }
            .step-label { display: none; }
            .step-connector { width: 24px; }
        }

        @media (max-width: 480px) {
            .booking-section { padding: 5rem 1rem 2rem; }
            .calendly-inline-widget { height: 900px; }
            .calendly-frame::before,
            .calendly-frame::after { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <!-- ===== NAV ===== -->
    <nav class="nav">
        <a href="index.html" class="nav-logo">HighTicket<strong>Elites</strong></a>
        <a href="index.html" class="nav-back">&larr; Back to Home</a>
    </nav>

    <!-- ===== BOOKING ===== -->
    <section class="booking-section noise-overlay">
        <div class="booking-container">

            <!-- Steps indicator -->
            <div class="booking-steps reveal">
                <div class="step">
                    <div class="step-num completed">&#10003;</div>
                    <span class="step-label completed">Apply</span>
                </div>
                <div class="step-connector"></div>
                <div class="step">
                    <div class="step-num active">2</div>
                    <span class="step-label active">Book Call</span>
                </div>
                <div class="step-connector"></div>
                <div class="step">
                    <div class="step-num upcoming">3</div>
                    <span class="step-label upcoming">Prepare</span>
                </div>
            </div>

            <div class="booking-header">
                <div class="section-badge reveal">Strategy Session</div>
                <h1 class="booking-title reveal reveal-delay-1">Book Your <span class="shimmer">Call</span> Below</h1>
                <p class="booking-subtitle reveal reveal-delay-2">Select a time that works for you. We'll discuss your goals and see if you're the right fit.</p>
            </div>

            <div class="calendly-frame reveal reveal-delay-3">
                <div class="calendly-card">
                    <!-- Calendly inline widget begin -->
                    <div class="calendly-inline-widget"
                         id="calendly-embed"
                         data-url="https://calendly.com/d/cv8s-c7t-5w3/highticketelites-strategy-session">
                    </div>
                    <!-- Calendly inline widget end -->
                </div>
            </div>

            <div class="booking-footer reveal">
                <p class="booking-note">Please wait for the confirmation page to load after booking your call</p>
            </div>
        </div>
    </section>

    <script>
        // Reveal on scroll
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        // Initialize Calendly with UTM parameters
        function initializeCalendly() {
            const utmData = window.__UTM__ ? window.__UTM__.read() : {};
            const calendlyEmbed = document.getElementById('calendly-embed');

            // Build URL with UTM parameters
            let calendlyUrl = calendlyEmbed.getAttribute('data-url');
            const params = new URLSearchParams();

            // Hide event details for simpler view
            params.set('hide_event_type_details', '1');

            // Add UTM parameters if they exist
            if (utmData.utm_source) params.set('utm_source', utmData.utm_source);
            if (utmData.utm_medium) params.set('utm_medium', utmData.utm_medium);
            if (utmData.utm_campaign) params.set('utm_campaign', utmData.utm_campaign);
            if (utmData.utm_term) params.set('utm_term', utmData.utm_term);
            if (utmData.utm_content) params.set('utm_content', utmData.utm_content);

            // Append parameters to URL
            if (params.toString()) {
                calendlyUrl += (calendlyUrl.includes('?') ? '&' : '?') + params.toString();
            }

            // Initialize Calendly widget
            Calendly.initInlineWidget({
                url: calendlyUrl,
                parentElement: calendlyEmbed,
                prefill: {},
                utm: utmData
            });

            console.info('[Calendly] Initialized with UTMs:', utmData);
        }

        // Wait for Calendly script to load
        if (typeof Calendly !== 'undefined') {
            initializeCalendly();
        } else {
            window.addEventListener('load', function() {
                if (typeof Calendly !== 'undefined') {
                    initializeCalendly();
                } else {
                    setTimeout(initializeCalendly, 1000);
                }
            });
        }
    </script>
</body>
</html>
